[package]
name = "pudduscroll"
version = "0.3.3"
description = "PudduScroll Instagram carousel composer"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors = ["Dario Puddinu"]

[dependencies]
eframe = { workspace = true }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
image = { workspace = true, features = ["png", "jpeg", "webp"] }
moxcms = "0.8.1"
pudduscroll-core = { workspace = true }
pudduscroll-display = { path = "../display", version = "0.3.3" }
rfd = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.7"
ureq = { version = "2", default-features = false, features = ["rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "DomException",
    "DomStringList",
    "Element",
    "Headers",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Response",
    "Url",
    "Window",
] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "=0.30.13"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[lints]
workspace = true
