[package]
name = "pudduscroll"
version = "0.1.0"
description = "PudduScroll desktop Instagram carousel composer"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors = ["Dario Puddinu"]

[dependencies]
eframe = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "webp"] }
moxcms = "0.8.1"
pudduscroll-core = { workspace = true }
pudduscroll-display = { path = "../display", version = "0.1.0" }
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "=0.30.13"

[lints]
workspace = true
