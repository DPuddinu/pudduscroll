<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PudduScroll</title>
    <link data-trunk rel="rust" data-bin="pudduscroll" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101010;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="pudduscroll"></canvas>
    <script>
      addEventListener("keydown", (event) => {
        if (event.key !== " ") return;
        const tag = event.target && event.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        event.preventDefault();
      });
    </script>
  </body>
</html>
