name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: pudduscroll-windows-x86_64.zip
          - label: Linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: pudduscroll-linux-x86_64.tar.gz
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            archive: pudduscroll-macos-aarch64.zip
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            archive: pudduscroll-macos-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check Linux libraries
        if: runner.os == 'Linux'
        run: |
          ldd "target/${{ matrix.target }}/release/pudduscroll"
          if ldd "target/${{ matrix.target }}/release/pudduscroll" | grep -q 'not found'; then
            exit 1
          fi
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          tar -a -cf "dist/${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" pudduscroll.exe
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.archive }}" pudduscroll
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/PudduScroll.app/Contents/MacOS
          cp "target/${{ matrix.target }}/release/pudduscroll" dist/PudduScroll.app/Contents/MacOS/pudduscroll
          chmod +x dist/PudduScroll.app/Contents/MacOS/pudduscroll
          cat > dist/PudduScroll.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>PudduScroll</string>
            <key>CFBundleDisplayName</key>
            <string>PudduScroll</string>
            <key>CFBundleIdentifier</key>
            <string>com.pudduscroll.app</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleExecutable</key>
            <string>pudduscroll</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          ditto -c -k --keepParent dist/PudduScroll.app "dist/${{ matrix.archive }}"
          rm -rf dist/PudduScroll.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md << 'ENDNOTES'
          PudduScroll 0.1.0 is the first desktop release. Photos sit on a horizontal strip of canvases and can cross the boundaries, so a swipe looks seamless.

          ## Downloads

          | File | System |
          | --- | --- |
          | `pudduscroll-windows-x86_64.zip` | Windows 10 or later, 64-bit. Unzip and run `pudduscroll.exe`. |
          | `pudduscroll-macos-aarch64.zip` | macOS on Apple silicon. Unzip and open `PudduScroll.app`. |
          | `pudduscroll-macos-x86_64.zip` | macOS on Intel. Unzip and open `PudduScroll.app`. |
          | `pudduscroll-linux-x86_64.tar.gz` | 64-bit Linux. Built on Ubuntu 24.04. |

          These builds are unsigned. Windows SmartScreen and macOS Gatekeeper ask for confirmation. On a Mac, right-click `PudduScroll.app` and choose Open.

          Linux needs a Vulkan driver and these packages:

          ```bash
          sudo apt-get install -y libxkbcommon0 libwayland-client0 libvulkan1 libxcb-render0 libxcb-shape0 libxcb-xfixes0
          tar -xzf pudduscroll-linux-x86_64.tar.gz
          chmod +x pudduscroll
          ./pudduscroll
          ```

          Templates and carousels are saved on this machine:

          - Windows: `%LOCALAPPDATA%\pudduscroll`
          - macOS: `~/Library/Application Support/pudduscroll`
          - Linux: `$XDG_DATA_HOME/pudduscroll`, or `~/.local/share/pudduscroll`

          ## Templates and carousels

          - The home screen lists templates and carousels.
          - Create a template with a name, a cover image (PNG, JPEG, or WebP), and a starting ratio. A new template starts at 4:5.
          - Click a template to start a carousel from its layout. Edit changes the template. Delete removes it.
          - A template stores the frames and the layout. Photos are added on the carousel.
          - A carousel card shows a preview of the first slide. Rename it on the card. Duplicate copies the layout, the photos, and the grid. Delete removes that carousel only.
          - The library is saved as you edit, and again when the app closes.

          ## Canvas

          - Ratios are 1:1, 4:5, 3:4, and 9:16. 3:4 is the taller Instagram portrait.
          - Changing the ratio resizes every canvas and leaves each frame where it sits on the strip, including across the gaps.
          - Add or remove canvases, from 1 up to 20. The count is shown as `03 / 20`.
          - The pixel size under the ratio is the size export will write. Width is the largest size that still uses each photo’s own pixels, so a slide stays within the crop. When that size cannot be taken from a photo, the width is 1080 px. Height follows the ratio.

          ## Frames and photos

          - Add frame drops a new frame onto the strip, one canvas wide, on the next canvas and on top.
          - Edit frame turns on move and resize for the selected frame. Drag the frame to move it, including across canvas boundaries. Drag a corner to resize and keep its shape. Drag an edge to change one side.
          - The ratio buttons set that frame’s shape: 1:1, 4:5, 3:4, or 9:16. Remove frame deletes the selected frame. Delete does the same when the frame has no photo.
          - Grid draws an alignment grid on every canvas, from 2 to 16 squares. Snap, with the grid on, pulls a frame onto that grid when you release a move or a resize. The square count is kept with each carousel.
          - On a carousel, an empty frame shows a plus. Click it and pick a PNG, JPEG, or WebP. The photo fills the frame.
          - With Edit frame off, drag a photo to slide it inside the frame. With Edit frame on, scroll over the selected photo to zoom it toward the pointer, from 1× up to 8×.
          - Rotate by 90° counterclockwise or clockwise, or turn on Free and drag the handle for any angle. Remove photo clears the picture and leaves the frame. Delete does the same when a photo is selected.
          - A photo can have a border. The slider and the percent field run from 0 to 100. The swatch opens a color picker. The border is drawn inside the frame and is clipped with the slide.
          - Crop applies to the selected photo on a carousel. Presets are Original, 1:1, 4:5, 3:4, 3:2, 16:9, 9:16, and Freehand. A locked preset keeps that shape while you drag. Freehand moves each edge on its own. Original restores the full picture. Crop keeps the photo’s proportions. Enter keeps the crop. Escape cancels it.
          - Every frame is a layer. The list is front to back: the top row draws on top and wins the click. Hover a row to move that frame up, down, to the front, or to the back. Click a row to select it.

          ## Editing

          - Scroll to zoom the strip. Hold Alt and scroll, or hold Space and drag, to move along it. Click empty space to clear the selection.
          - The right rail holds Canvas, Frame, Photo, Crop, and Layers. Drag the splits between those sections to give one of them more room.
          - Undo is Ctrl+Z, or Cmd+Z on macOS. Redo is Ctrl+Y, Cmd+Y, Ctrl+Shift+Z, or Cmd+Shift+Z. A drag, a zoom, a border change, and a grid change each become one step. Undo cancels an open crop before it steps back through edits.
          - Canvas previews follow the monitor color profile, using a profile embedded in the file. Export is rendered from the original file bytes.
          - Canvas dividers are shown while editing.

          ## Export

          - Export is available once a carousel has a photo. It writes one image per canvas into a folder you pick.
          - The dialog previews one slide at a time. Step through it with the arrows or with Left and Right.
          - Choose JPEG or PNG. The JPEG slider runs from a small file to quality 100. PNG is the rendered slide with no extra compression.
          - The dialog estimates the encoded size of the whole carousel and shows it in megabytes.
          - Files are named from the carousel. Spaces become underscores, so a carousel named `Summer trip` writes `Summer_trip-01.jpg`, then `Summer_trip-02.jpg`.
          - When those names are already in the folder, PudduScroll lists them and asks before replacing them.
          ENDNOTES
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PudduScroll ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
