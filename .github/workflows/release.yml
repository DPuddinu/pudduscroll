name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: pudduscroll-windows-x86_64.zip
          - label: Linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: pudduscroll-linux-x86_64.tar.gz
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            archive: pudduscroll-macos-aarch64.zip
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            archive: pudduscroll-macos-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check Linux libraries
        if: runner.os == 'Linux'
        run: |
          ldd "target/${{ matrix.target }}/release/pudduscroll"
          if ldd "target/${{ matrix.target }}/release/pudduscroll" | grep -q 'not found'; then
            exit 1
          fi
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          tar -a -cf "dist/${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" pudduscroll.exe
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.archive }}" pudduscroll
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/PudduScroll.app/Contents/MacOS
          cp "target/${{ matrix.target }}/release/pudduscroll" dist/PudduScroll.app/Contents/MacOS/pudduscroll
          chmod +x dist/PudduScroll.app/Contents/MacOS/pudduscroll
          cat > dist/PudduScroll.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>PudduScroll</string>
            <key>CFBundleDisplayName</key>
            <string>PudduScroll</string>
            <key>CFBundleIdentifier</key>
            <string>com.pudduscroll.app</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleExecutable</key>
            <string>pudduscroll</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          ditto -c -k --keepParent dist/PudduScroll.app "dist/${{ matrix.archive }}"
          rm -rf dist/PudduScroll.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md << 'ENDNOTES'
          PudduScroll 0.3.0 checks GitHub at startup and installs a newer build for this computer. Delete asks before it removes a carousel, template, canvas, frame, or photo.

          ## Downloads

          | File | System |
          | --- | --- |
          | `pudduscroll-windows-x86_64.zip` | Windows 10 or later, 64-bit. Unzip and run `pudduscroll.exe`. |
          | `pudduscroll-macos-aarch64.zip` | macOS on Apple silicon. Unzip and open `PudduScroll.app`. |
          | `pudduscroll-macos-x86_64.zip` | macOS on Intel. Unzip and open `PudduScroll.app`. |
          | `pudduscroll-linux-x86_64.tar.gz` | 64-bit Linux. Built on Ubuntu 24.04. |

          These builds are unsigned. Windows SmartScreen and macOS Gatekeeper ask for confirmation. On a Mac, right-click `PudduScroll.app` and choose Open.

          Linux needs a Vulkan driver and these packages:

          ```bash
          sudo apt-get install -y libxkbcommon0 libwayland-client0 libvulkan1 libxcb-render0 libxcb-shape0 libxcb-xfixes0
          tar -xzf pudduscroll-linux-x86_64.tar.gz
          chmod +x pudduscroll
          ./pudduscroll
          ```

          Templates and carousels are saved on this machine:

          - Windows: `%LOCALAPPDATA%\pudduscroll`
          - macOS: `~/Library/Application Support/pudduscroll`
          - Linux: `$XDG_DATA_HOME/pudduscroll`, or `~/.local/share/pudduscroll`

          ## New

          - A release build looks up the latest GitHub release when it opens. When that release is newer, it downloads the archive for this system, replaces the running app, and starts again.
          - Windows installs `pudduscroll-windows-x86_64.zip`. Linux installs `pudduscroll-linux-x86_64.tar.gz`. Apple silicon installs `pudduscroll-macos-aarch64.zip`. Intel Macs install `pudduscroll-macos-x86_64.zip`.
          - Delete, Remove, and the Delete key ask before they remove a carousel, a template, a canvas, a frame, or a photo.
          ENDNOTES
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PudduScroll ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
